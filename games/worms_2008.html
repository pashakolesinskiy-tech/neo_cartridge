        this.activeTeamIdx = 0;
        this.randomizeWind();
        this.startTurn();

        // Close menu
        document.getElementById('menu-modal').style.display = 'none';
        AudioEngine.playWormVoice('yippee');
      },

      randomizeWind() {
        this.wind = Number(((Math.random() - 0.5) * 8).toFixed(1));
        const bar = document.getElementById('wind-fill-bar');
        const text = document.getElementById('wind-val-text');
        if (bar) {
          const pct = (Math.abs(this.wind) / 4) * 50;
          if (this.wind >= 0) {
            bar.style.left = '50%';
            bar.style.width = `${Math.min(50, pct)}%`;
            bar.style.background = 'linear-gradient(90deg, #38bdf8, #0284c7)';
          } else {
            bar.style.left = `${50 - Math.min(50, pct)}%`;
            bar.style.width = `${Math.min(50, pct)}%`;
            bar.style.background = 'linear-gradient(270deg, #38bdf8, #0284c7)';
          }
        }
        if (text) text.textContent = `${this.wind > 0 ? '+' : ''}${this.wind} м/с`;
      },

      startTurn() {
        this.state = 'turn_active';
        this.turnTimer = 45;
        this.aimPower = 0;
        this.isChargingFire = false;
        this.shotgunShotsLeft = (this.selectedWeaponId === 'shotgun') ? 2 : 0;

        const currentTeam = this.teams[this.activeTeamIdx];
        const worm = this.getActiveWorm();

        // Recenter camera on active worm
        if (worm) {
          this.camera.targetX = worm.x;
          this.camera.targetY = worm.y - 40;
        }

        // Announce turn banner
        const announcer = document.getElementById('turn-announcer');
        if (announcer) {
          announcer.textContent = `ХОД: КОМАНДА ${currentTeam.name}!`;
          announcer.style.borderColor = currentTeam.color;
          announcer.classList.add('show');
          setTimeout(() => announcer.classList.remove('show'), 1600);
        }

        this.updateHUD();

        // Parachute Supply Crate Airdrop chance
        if (Math.random() < 0.45 && this.crates.length < 3) {
          const dropX = 180 + Math.random() * (this.width - 360);
          this.crates.push({
            x: dropX,
            y: -20,
            vy: 65,
            isLanded: false,
            content: Math.random() > 0.5 ? 'health' : (Math.random() > 0.5 ? 'holy' : 'airstrike')
          });
          this.floatingTexts.push({ x: dropX, y: 50, text: '📦 ПРИПАСЫ С НЕБА!', color: '#facc15', life: 2.0 });
        }

        // If AI Turn, trigger Bot Logic
        if (currentTeam.isAi) {
          setTimeout(() => this.runAiTurn(), 1200);
        }
      },

      getActiveWorm() {
        const team = this.teams[this.activeTeamIdx];
        if (!team) return null;
        return team.worms.find(w => w.hp > 0) || null;
      },

      updateHUD() {
        const currentTeam = this.teams[this.activeTeamIdx];
        const teamBadge = document.getElementById('hud-team-badge');
        const teamName = document.getElementById('hud-team-name');
        const timerVal = document.getElementById('hud-turn-timer');

        if (teamBadge && currentTeam) {
          teamBadge.className = `team-badge ${currentTeam.badgeClass}`;
        }
        if (teamName && currentTeam) {
          teamName.textContent = currentTeam.name;
        }
        if (timerVal) {
          timerVal.textContent = Math.ceil(this.turnTimer);
          timerVal.classList.toggle('danger', this.turnTimer < 10);
        }

        // Weapon pill
        const curWp = WEAPONS.find(w => w.id === this.selectedWeaponId) || WEAPONS[0];
        const pillIcon = document.getElementById('pill-weapon-icon');
        const pillName = document.getElementById('pill-weapon-name');
        const pillAmmo = document.getElementById('pill-weapon-ammo');
        if (pillIcon) pillIcon.textContent = curWp.icon;
        if (pillName) pillName.textContent = curWp.name;
        if (pillAmmo) pillAmmo.textContent = curWp.ammo === Infinity ? '∞' : curWp.ammo;

        // Angle text
        const angleEl = document.getElementById('aim-angle-text');
        if (angleEl) angleEl.textContent = `${Math.round(this.aimAngle)}°`;
      },

      /* =======================================================================
         AI BOT CONTROLLER (SMART BALLISTICS & ATTACK)
         ======================================================================= */
      runAiTurn() {
        if (this.state !== 'turn_active') return;
        const worm = this.getActiveWorm();
        if (!worm) return;

        // Find nearest living opponent worm
        const opponentTeam = this.teams.find(t => t !== this.teams[this.activeTeamIdx]);
        if (!opponentTeam) return;
        const liveEnemies = opponentTeam.worms.filter(w => w.hp > 0);
        if (liveEnemies.length === 0) return;

        let nearest = liveEnemies[0];
        let minDist = Infinity;
        liveEnemies.forEach(e => {
          const d = Math.hypot(e.x - worm.x, e.y - worm.y);
          if (d < minDist) { minDist = d; nearest = e; }
        });

        // Face the target
        worm.facing = (nearest.x > worm.x) ? 1 : -1;

        // Calculate ballistic angle & power
        const dx = nearest.x - worm.x;
        const dy = nearest.y - worm.y;
        let baseAngle = (dx > 0) ? 42 : 138;

        // Add wind compensation
        baseAngle -= this.wind * 2.2 * worm.facing;
        this.aimAngle = Math.max(15, Math.min(165, baseAngle));

        // Power scaled by distance
        const dist = Math.hypot(dx, dy);
        const wantedPower = Math.min(100, Math.max(30, dist * 0.16));

        // Speak taunt
        this.floatingTexts.push({
          x: worm.x,
          y: worm.y - 32,
          text: 'Лови подарочек! 🎯',
          color: '#ffffff',
          life: 1.6
        });

        // Simulate aiming and charging
        setTimeout(() => {
          if (this.state !== 'turn_active') return;
          this.executeShot(wantedPower);
        }, 1200);
      },

      /* =======================================================================
         FIRING & SHOT RESOLUTION
         ======================================================================= */
      fireCurrentWeapon() {
        if (this.state !== 'turn_active') return;
        const worm = this.getActiveWorm();
        if (!worm) return;

        // Start power charge on hold
        this.isChargingFire = true;
      },

      releaseFire() {
        if (!this.isChargingFire || this.state !== 'turn_active') return;
        this.isChargingFire = false;
        const power = Math.max(15, this.aimPower);
        this.aimPower = 0;
        this.updatePowerGauge(0);
        this.executeShot(power);
      },

      executeShot(power) {
        const worm = this.getActiveWorm();
        if (!worm) return;

        const rad = (this.aimAngle * Math.PI) / 180;
        const speed = power * 7.5;
        const spawnDist = 18;
        const muzzleX = worm.x + Math.cos(rad) * spawnDist;
        const muzzleY = worm.y - Math.sin(rad) * spawnDist - 2;

        AudioEngine.playWormVoice('fire');

        if (this.selectedWeaponId === 'bazooka') {
          AudioEngine.playBazookaLaunch();
          this.projectiles.push({
            type: 'bazooka',
            x: muzzleX,
            y: muzzleY,
            vx: Math.cos(rad) * speed,
            vy: -Math.sin(rad) * speed,
            radius: 4,
            blastRadius: 40,
            damage: 48,
            life: 8
          });
        } else if (this.selectedWeaponId === 'grenade') {
          AudioEngine.playBazookaLaunch();
          this.projectiles.push({
            type: 'grenade',
            x: muzzleX,
            y: muzzleY,
            vx: Math.cos(rad) * speed,
            vy: -Math.sin(rad) * speed,
            radius: 5,
            blastRadius: 46,
            damage: 55,
            timer: this.grenadeTimer,
            life: this.grenadeTimer
          });
        } else if (this.selectedWeaponId === 'cluster') {
          AudioEngine.playBazookaLaunch();
          this.projectiles.push({
            type: 'cluster',
            x: muzzleX,
            y: muzzleY,
            vx: Math.cos(rad) * speed,
            vy: -Math.sin(rad) * speed,
            radius: 5,
            blastRadius: 36,
            damage: 40,
            timer: this.grenadeTimer,
            life: this.grenadeTimer
          });
        } else if (this.selectedWeaponId === 'shotgun') {
          AudioEngine.playShotgun();
          this.projectiles.push({
            type: 'shotgun_slug',
            x: muzzleX,
            y: muzzleY,
            vx: Math.cos(rad) * 1200,
            vy: -Math.sin(rad) * 1200,
            blastRadius: 22,
            damage: 28,
            life: 0.8
          });
          this.shotgunShotsLeft--;
          if (this.shotgunShotsLeft > 0) {
            // Can fire one more time!
            return;
          }
        } else if (this.selectedWeaponId === 'uzi') {
          // Rapid fire burst of 8 bullets
          for (let b = 0; b < 8; b++) {
            setTimeout(() => {
              if (this.state === 'game_over') return;
              AudioEngine.playShotgun();
              const spread = (Math.random() - 0.5) * 0.12;
              this.projectiles.push({
                type: 'bullet',
                x: muzzleX,
                y: muzzleY,
                vx: Math.cos(rad + spread) * 950,
                vy: -Math.sin(rad + spread) * 950,
                damage: 8,
                life: 0.6
              });
            }, b * 65);
          }
        } else if (this.selectedWeaponId === 'dynamite') {
          // Drop right at worm feet
          AudioEngine.playBounce();
          this.projectiles.push({
            type: 'dynamite',
            x: worm.x,
            y: worm.y + 4,
            vx: 0,
            vy: 0,
            radius: 6,
            blastRadius: 65,
            damage: 75,
            timer: 5.0,
            life: 5.0
          });
        } else if (this.selectedWeaponId === 'mine') {
          // Place proximity mine
          AudioEngine.playBounce();
          this.projectiles.push({
            type: 'mine',
            x: worm.x,
            y: worm.y + 4,
            vx: worm.facing * 30,
            vy: -40,
            radius: 6,
            blastRadius: 48,
            damage: 55,
            armTimer: 2.0,
            fuseTimer: 2.0,
            isTriggered: false,
            life: 60
          });
        } else if (this.selectedWeaponId === 'holy') {
          AudioEngine.playBazookaLaunch();
          this.projectiles.push({
            type: 'holy',
            x: muzzleX,
            y: muzzleY,
            vx: Math.cos(rad) * speed * 0.9,
            vy: -Math.sin(rad) * speed * 0.9,
            radius: 6,
            blastRadius: 85,
            damage: 90,
            timer: 3.5,
            life: 3.5
          });
        } else if (this.selectedWeaponId === 'bat') {
          // Melee swing
          AudioEngine.playBatHit();
          const hitRadius = 38;
          let hitAny = false;
          this.teams.forEach(team => {
            team.worms.forEach(w => {
              if (w !== worm && w.hp > 0 && Math.hypot(w.x - muzzleX, w.y - muzzleY) < hitRadius) {
                hitAny = true;
                w.hp -= 35;
                w.vx = worm.facing * 450;
                w.vy = -380;
                AudioEngine.playWormVoice('ouch');
                this.floatingTexts.push({ x: w.x, y: w.y - 20, text: 'HOME RUN! ⚾ -35', color: '#ffea00', life: 1.5 });
              }
            });
          });
          if (!hitAny) {
            this.floatingTexts.push({ x: worm.x, y: worm.y - 20, text: 'ПРОМАХ! 💨', color: '#cbd5e1', life: 1.2 });
          }
        } else if (this.selectedWeaponId === 'airstrike') {
          const targetX = this.targetBeacon ? this.targetBeacon.x : (worm.x + worm.facing * 180);
          const targetY = this.targetBeacon ? this.targetBeacon.y : worm.y;
          this.triggerAirStrike(targetX, targetY);
        } else if (this.selectedWeaponId === 'teleport') {
          const targetX = this.targetBeacon ? this.targetBeacon.x : (worm.x + worm.facing * 140);
          const targetY = this.targetBeacon ? this.targetBeacon.y : (worm.y - 40);
          this.triggerTeleport(targetX, targetY);
        } else if (this.selectedWeaponId === 'girder') {
          const targetX = this.targetBeacon ? this.targetBeacon.x : (worm.x + worm.facing * 75);
          const targetY = this.targetBeacon ? this.targetBeacon.y : worm.y;
          this.triggerGirder(targetX, targetY);
        } else if (this.selectedWeaponId === 'skip') {
          // Immediately enter retreat phase
        }

        this.targetBeacon = null;

        // Enter retreat phase (5s countdown to hide)
        this.enterRetreatPhase();
      },

      triggerAirStrike(tx, ty) {
        AudioEngine.playJetSound();
        const startLeft = (this.wind >= 0);
        const jetX = startLeft ? -120 : (this.width + 120);
        const jetVx = startLeft ? 780 : -780;

        this.jets.push({
          x: jetX,
          y: 70,
          vx: jetVx,
          targetX: tx,
          hasDropped: false
        });

        this.floatingTexts.push({ x: tx, y: ty - 40, text: '✈️ АВИАУДАР ЗАПРОШЕН!', color: '#ff3344', life: 1.8 });
      },

      triggerTeleport(tx, ty) {
        const worm = this.getActiveWorm();
        if (!worm) return;
        AudioEngine.playTeleportSound();

        // Departure sparkles
        for (let k = 0; k < 20; k++) {
          const a = Math.random() * Math.PI * 2;
          const spd = 30 + Math.random() * 90;
          this.particles.push({
            type: 'spark',
            x: worm.x, y: worm.y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            radius: 2 + Math.random() * 2.5,
            color: '#38bdf8',
            life: 0.5
          });
        }

        worm.x = tx;
        worm.y = ty;
        worm.vx = 0;
        worm.vy = 0;

        // Arrival sparkles
        for (let k = 0; k < 20; k++) {
          const a = Math.random() * Math.PI * 2;
          const spd = 30 + Math.random() * 90;
          this.particles.push({
            type: 'spark',
            x: tx, y: ty,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            radius: 2 + Math.random() * 2.5,
            color: '#38bdf8',
            life: 0.5
          });
        }

        this.floatingTexts.push({ x: tx, y: ty - 25, text: 'ТЕЛЕПОРТ! 🌀', color: '#38bdf8', life: 1.5 });
      },

      triggerGirder(tx, ty) {
        AudioEngine.playBounce();
        const tctx = this.terrainCtx;
        tctx.save();
        tctx.fillStyle = '#64748b';
        tctx.strokeStyle = '#94a3b8';
        tctx.lineWidth = 2;

        const gw = 110;
        const gh = 14;
        tctx.fillRect(tx - gw / 2, ty - gh / 2, gw, gh);
        tctx.strokeRect(tx - gw / 2, ty - gh / 2, gw, gh);

        // Yellow hazard chevrons
        tctx.fillStyle = '#facc15';
        for (let i = -gw / 2 + 8; i < gw / 2 - 8; i += 16) {
          tctx.fillRect(tx + i, ty - gh / 2 + 2, 8, gh - 4);
        }
        tctx.restore();

        this.floatingTexts.push({ x: tx, y: ty - 20, text: 'СТАЛЬНАЯ БАЛКА! 🚧', color: '#facc15', life: 1.5 });
      },

      enterRetreatPhase() {
        this.state = 'retreat';
        this.retreatTimer = 5.0;

        const alertEl = document.getElementById('retreat-alert');
        if (alertEl) alertEl.style.display = 'block';
      },

      endTurnAndPass() {
        this.state = 'resolving';
        const alertEl = document.getElementById('retreat-alert');
        if (alertEl) alertEl.style.display = 'none';

        // Check Victory Condition
        let aliveTeams = this.teams.filter(t => t.worms.some(w => w.hp > 0));
        if (aliveTeams.length <= 1) {
          this.showGameOver(aliveTeams[0] || null);
          return;
        }

        // Advance to next team
        this.activeTeamIdx = (this.activeTeamIdx + 1) % this.teams.length;
        this.randomizeWind();

        setTimeout(() => {
          this.startTurn();
        }, 1200);
      },

      showGameOver(winnerTeam) {
        this.state = 'game_over';
        const modal = document.getElementById('menu-modal');
        const desc = document.getElementById('menu-desc-text');
        if (modal) modal.style.display = 'flex';
        if (desc) {
          if (winnerTeam) {
            desc.innerHTML = `<span style="font-size:1.3rem; color:${winnerTeam.color}; font-weight:900;">🏆 ПОБЕДА КОМАНДЫ ${winnerTeam.name}!</span><br>Все вражеские червячки повержены!`;
            AudioEngine.playWormVoice('yippee');
          } else {
            desc.textContent = 'НИЧЬЯ! Все червячки утонули!';
          }
        }
      },

      /* =======================================================================
         GAME LOOP (UPDATE & RENDER)
         ======================================================================= */
      loop(timestamp) {
        requestAnimationFrame((t) => this.loop(t));

        const dt = 1 / 60;
        this.update(dt);
        this.render();
      },

      update(dt) {
        this.waterTime += dt * 3.5;

        // Timers in active turn
        if (this.state === 'turn_active') {
          this.turnTimer -= dt;
          const timerVal = document.getElementById('hud-turn-timer');
          if (timerVal) {
            timerVal.textContent = Math.ceil(this.turnTimer);
            timerVal.classList.toggle('danger', this.turnTimer < 10);
          }
          if (this.turnTimer <= 0) {
            this.enterRetreatPhase();
          }

          // Fire Button Power Charge
          if (this.isChargingFire) {
            this.aimPower += dt * 65 * this.chargeDirection;
            if (this.aimPower >= 100) { this.aimPower = 100; this.chargeDirection = -1; }
            else if (this.aimPower <= 5) { this.aimPower = 5; this.chargeDirection = 1; }
            this.updatePowerGauge(this.aimPower);
          }
        } else if (this.state === 'retreat') {
          this.retreatTimer -= dt;
          const retVal = document.getElementById('retreat-timer-val');
          if (retVal) retVal.textContent = Math.ceil(this.retreatTimer);

          if (this.retreatTimer <= 0 && this.projectiles.length === 0) {
            this.endTurnAndPass();
          }
        }

        // Update Worms Physics
        const activeWorm = this.getActiveWorm();
        const canControl = (this.state === 'turn_active' || this.state === 'retreat') && !this.teams[this.activeTeamIdx].isAi;

        this.teams.forEach(team => {
          team.worms.forEach(worm => {
            if (worm.hp <= 0) return;

            // Player control applied only to active worm
            if (worm === activeWorm && canControl) {
              if (this.touch.walkLeft) {
                worm.facing = -1;
                this.tryMoveWorm(worm, -1);
              } else if (this.touch.walkRight) {
                worm.facing = 1;
                this.tryMoveWorm(worm, 1);
              }
            }

            // Gravity & Vertical Physics
            worm.vy += 650 * dt;
            worm.x += worm.vx * dt;
            worm.y += worm.vy * dt;
            worm.vx *= 0.92;

            // Ground Collision
            if (this.isSolidPixel(worm.x, worm.y + 12)) {
              // Push out of solid earth
              while (this.isSolidPixel(worm.x, worm.y + 11) && worm.y > 0) {
                worm.y -= 1;
              }
              if (worm.vy > 380) {
                // Hard landing fall damage
                const fallDmg = Math.round((worm.vy - 380) * 0.12);
                worm.hp -= fallDmg;
                AudioEngine.playWormVoice('ouch');
                this.floatingTexts.push({ x: worm.x, y: worm.y - 18, text: `-${fallDmg}`, color: '#ff3344', life: 1.0 });
              }
              worm.vy = 0;
            }

            // Water Drowning Check
            if (worm.y >= this.waterLevel) {
              worm.hp = 0;
              AudioEngine.playSplash();
              AudioEngine.playWormVoice('drown');
              this.createWaterSplash(worm.x, this.waterLevel);
              this.floatingTexts.push({ x: worm.x, y: this.waterLevel - 20, text: 'БУЛЬ-БУЛЬ! 💦', color: '#38bdf8', life: 1.5 });
            }
          });
        });

        // Update Projectiles
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
          const p = this.projectiles[i];
          p.life -= dt;

          if (p.type === 'bazooka') {
            // Wind acceleration on rockets!
            p.vx += this.wind * 25 * dt;
            p.vy += 320 * dt; // Gravity
            p.x += p.vx * dt;
            p.y += p.vy * dt;

            // Rocket smoke trail
            if (Math.random() < 0.6) {
              this.particles.push({
                type: 'smoke',
                x: p.x, y: p.y,
                vx: -p.vx * 0.08 + (Math.random() - 0.5) * 10,
                vy: -p.vy * 0.08 + (Math.random() - 0.5) * 10,
                radius: 3 + Math.random() * 3,
                color: 'rgba(240, 240, 250, 0.65)',
                life: 0.45
              });
            }

            // Impact check
            if (this.isSolidPixel(p.x, p.y) || this.checkWormImpact(p) || p.life <= 0) {
              this.detonateExplosion(p.x, p.y, p.blastRadius, p.damage);
              this.projectiles.splice(i, 1);
              continue;
            }
          } else if (p.type === 'grenade' || p.type === 'cluster' || p.type === 'cluster_sub' || p.type === 'holy') {
            p.vy += 520 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;

            // Bounce on terrain
            if (this.isSolidPixel(p.x, p.y + p.radius)) {
              p.y -= 2;
              p.vy = -p.vy * 0.55;
              p.vx = p.vx * 0.75;
              if (Math.abs(p.vy) > 40) AudioEngine.playBounce();
            }

            // Holy choir trigger before detonation
            if (p.type === 'holy' && p.timer <= 0.7 && !p.hasSung) {
              p.hasSung = true;
              AudioEngine.playHolyHallelujah();
            }

            p.timer -= dt;
            if (p.timer <= 0) {
              if (p.type === 'cluster') {
                // Split into 5 bomblets!
                for (let k = 0; k < 5; k++) {
                  const sa = (Math.PI * 2 / 5) * k;
                  this.projectiles.push({
                    type: 'cluster_sub',
                    x: p.x, y: p.y - 8,
                    vx: Math.cos(sa) * 140,
                    vy: -180 - Math.random() * 80,
                    radius: 3.5,
                    blastRadius: 28,
                    damage: 25,
                    timer: 1.5,
                    life: 1.5
                  });
                }
                AudioEngine.playExplosion();
              } else {
                this.detonateExplosion(p.x, p.y, p.blastRadius, p.damage);
              }
              this.projectiles.splice(i, 1);
              continue;
            }
          } else if (p.type === 'dynamite') {
            p.vy += 500 * dt;
            p.y += p.vy * dt;
            if (this.isSolidPixel(p.x, p.y + 8)) {
              p.y -= 1;
              p.vy = 0;
            }
            p.timer -= dt;
            if (p.timer <= 0) {
              this.detonateExplosion(p.x, p.y, p.blastRadius, p.damage);
              this.projectiles.splice(i, 1);
              continue;
            }
          } else if (p.type === 'mine') {
            p.vy += 500 * dt;
            p.y += p.vy * dt;
            if (this.isSolidPixel(p.x, p.y + 6)) {
              p.y -= 1;
              p.vy = 0;
            }
            if (p.armTimer > 0) p.armTimer -= dt;
            else {
              // Proximity scan
              let triggered = false;
              this.teams.forEach(t => t.worms.forEach(w => {
                if (w.hp > 0 && Math.hypot(w.x - p.x, w.y - p.y) < 28) triggered = true;
              }));
              if (triggered && !p.isTriggered) {
                p.isTriggered = true;
                AudioEngine.playBounce();
              }
              if (p.isTriggered) {
                p.fuseTimer -= dt;
                if (p.fuseTimer <= 0) {
                  this.detonateExplosion(p.x, p.y, p.blastRadius, p.damage);
                  this.projectiles.splice(i, 1);
                  continue;
                }
              }
            }
          } else if (p.type === 'shotgun_slug' || p.type === 'bullet') {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            if (this.isSolidPixel(p.x, p.y) || this.checkWormImpact(p) || p.life <= 0) {
              this.detonateExplosion(p.x, p.y, p.blastRadius || 12, p.damage);
              this.projectiles.splice(i, 1);
              continue;
            }
          } else if (p.type === 'airstrike_bomb') {
            p.vy += 460 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            if (this.isSolidPixel(p.x, p.y) || this.checkWormImpact(p) || p.life <= 0) {
              this.detonateExplosion(p.x, p.y, p.blastRadius, p.damage);
              this.projectiles.splice(i, 1);
              continue;
            }
          }

          // Drown in water
          if (p.y >= this.waterLevel) {
            AudioEngine.playSplash();
            this.createWaterSplash(p.x, this.waterLevel);
            this.projectiles.splice(i, 1);
          }
        }

        // Update Bomber Jets
        for (let j = this.jets.length - 1; j >= 0; j--) {
          const jet = this.jets[j];
          jet.x += jet.vx * dt;

          // Contrails
          if (Math.random() < 0.75) {
            this.particles.push({
              type: 'smoke',
              x: jet.x - (jet.vx > 0 ? 30 : -30),
              y: jet.y + (Math.random() - 0.5) * 6,
              vx: -jet.vx * 0.05,
              vy: (Math.random() - 0.5) * 8,
              radius: 4 + Math.random() * 3,
              color: 'rgba(255, 255, 255, 0.65)',
              life: 0.6
            });
          }

          // Drop cluster bombs when approaching targetX
          if (!jet.hasDropped && Math.abs(jet.x - jet.targetX) < 140) {
            jet.hasDropped = true;
            for (let b = 0; b < 5; b++) {
              setTimeout(() => {
                if (this.state === 'game_over') return;
                AudioEngine.playBazookaLaunch();
                const bx = jet.x + (b - 2) * 26;
                this.projectiles.push({
                  type: 'airstrike_bomb',
                  x: bx,
                  y: jet.y + 12,
                  vx: jet.vx * 0.2 + (Math.random() - 0.5) * 25,
                  vy: 90,
                  blastRadius: 36,
                  damage: 38,
                  life: 5
                });
              }, b * 110);
            }
          }

          if (jet.x < -200 || jet.x > this.width + 200) {
            this.jets.splice(j, 1);
          }
        }

        // Update Supply Crates
        for (let c = this.crates.length - 1; c >= 0; c--) {
          const cr = this.crates[c];
          if (!cr.isLanded) {
            cr.y += cr.vy * dt;
            cr.x += this.wind * 6 * dt;

            // Ground touch
            if (this.isSolidPixel(cr.x, cr.y + 12)) {
              cr.isLanded = true;
              cr.vy = 0;
              AudioEngine.playBounce();
            }
          }

          // Worm pickup check
          for (const team of this.teams) {
            for (const w of team.worms) {
              if (w.hp > 0 && Math.hypot(w.x - cr.x, w.y - cr.y) < 22) {
                AudioEngine.playCratePickup();
                if (cr.content === 'health') {
                  w.hp = Math.min(w.maxHp, w.hp + 35);
                  this.floatingTexts.push({ x: w.x, y: w.y - 25, text: '+35 HP! 💊', color: '#22c55e', life: 1.6 });
                } else if (cr.content === 'holy') {
                  const holyWp = WEAPONS.find(wp => wp.id === 'holy');
                  if (holyWp) holyWp.ammo = (holyWp.ammo || 0) + 1;
                  this.floatingTexts.push({ x: w.x, y: w.y - 25, text: '+СВЯТАЯ ГРАНАТА! ✨', color: '#facc15', life: 1.6 });
                } else {
                  const airWp = WEAPONS.find(wp => wp.id === 'airstrike');
                  if (airWp) airWp.ammo = (airWp.ammo || 0) + 1;
                  this.floatingTexts.push({ x: w.x, y: w.y - 25, text: '+АВИАУДАР! ✈️', color: '#38bdf8', life: 1.6 });
                }
                this.updateHUD();
                this.crates.splice(c, 1);
                break;
              }
            }
            if (!this.crates[c]) break;
          }

          if (cr.y >= this.waterLevel) {
            this.createWaterSplash(cr.x, this.waterLevel);
            this.crates.splice(c, 1);
          }
        }

        // Update Particles & Floating Text
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const pt = this.particles[i];
          pt.life -= dt;
          if (pt.life <= 0) { this.particles.splice(i, 1); continue; }
          pt.vy += 380 * dt;
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
        }

        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          const ft = this.floatingTexts[i];
          ft.life -= dt;
          ft.y -= dt * 25;
          if (ft.life <= 0) this.floatingTexts.splice(i, 1);
        }

        // Smooth Camera Follow
        if (this.projectiles.length > 0) {
          // Track flying projectile
          const lead = this.projectiles[0];
          this.camera.targetX = lead.x;
          this.camera.targetY = lead.y;
        } else if (activeWorm) {
          this.camera.targetX = activeWorm.x;
          this.camera.targetY = activeWorm.y - 30;
        }

        this.camera.x += (this.camera.targetX - this.camera.x) * 0.08;
        this.camera.y += (this.camera.targetY - this.camera.y) * 0.08;
        this.camera.zoom += (this.camera.targetZoom - this.camera.zoom) * 0.08;
      },

      tryMoveWorm(worm, dir) {
        const stepDist = 1.6;
        const targetX = worm.x + dir * stepDist;

        // Slope climbing (up to 8px step-up)
        let climbY = worm.y;
        let canClimb = false;
        for (let offset = -8; offset <= 4; offset++) {
          if (!this.isSolidPixel(targetX, climbY + offset) && this.isSolidPixel(targetX, climbY + offset + 12)) {
            climbY += offset;
            canClimb = true;
            break;
          }
        }

        if (canClimb && targetX > 20 && targetX < this.width - 20) {
          worm.x = targetX;
          worm.y = climbY;
        }
      },

      checkWormImpact(p) {
        for (const team of this.teams) {
          for (const w of team.worms) {
            if (w.hp > 0 && Math.hypot(w.x - p.x, w.y - p.y) < 16) {
              return true;
            }
          }
        }
        return false;
      },

      detonateExplosion(x, y, radius, damage) {
        AudioEngine.playExplosion();
        this.carveCrater(x, y, radius);

        // Radial splash damage and knockback on worms
        this.teams.forEach(team => {
          team.worms.forEach(w => {
            if (w.hp <= 0) return;
            const dist = Math.hypot(w.x - x, w.y - y);
            if (dist < radius * 1.5) {
              const ratio = Math.max(0, 1 - (dist / (radius * 1.5)));
              const dmg = Math.round(damage * ratio);
              w.hp -= dmg;

              // Knockback impulse away from explosion center
              const angle = Math.atan2(w.y - y, w.x - x);
              const force = ratio * 420;
              w.vx = Math.cos(angle) * force;
              w.vy = Math.sin(angle) * force - 90; // Pop into air!

              AudioEngine.playWormVoice('ouch');
              this.floatingTexts.push({
                x: w.x,
                y: w.y - 20,
                text: `-${dmg}`,
                color: '#ff3344',
                life: 1.2
              });
            }
          });
        });

        // Flashy blast shockwaves
        for (let k = 0; k < 14; k++) {
          const a = Math.random() * Math.PI * 2;
          const spd = 40 + Math.random() * 120;
          this.particles.push({
            type: 'fireball',
            x: x, y: y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            radius: 4 + Math.random() * 6,
            color: Math.random() > 0.5 ? '#f97316' : '#ef4444',
            life: 0.35
          });
        }
      },

      createWaterSplash(x, y) {
        for (let k = 0; k < 16; k++) {
          this.particles.push({
            type: 'water',
            x: x + (Math.random() - 0.5) * 20,
            y: y,
            vx: (Math.random() - 0.5) * 90,
            vy: -120 - Math.random() * 120,
            radius: 2 + Math.random() * 3,
            color: '#38bdf8',
            life: 0.6
          });
        }
      },

      updatePowerGauge(val) {
        const ring = document.getElementById('power-ring-fill');
        if (ring) {
          const totalLength = 276;
          const offset = totalLength - (val / 100) * totalLength;
          ring.style.strokeDashoffset = offset;
          // Interpolate stroke color from green -> yellow -> red
          if (val < 45) ring.style.stroke = '#22c55e';
          else if (val < 80) ring.style.stroke = '#facc15';
          else ring.style.stroke = '#ff3344';
        }
      },

      /* =======================================================================
         RENDER PASS (SKY, TERRAIN, WORMS, WATER, HUD)
         ======================================================================= */
      render() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;

        ctx.save();
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, w, h);

        // Camera Transform
        ctx.translate(w / 2, h / 2);
        ctx.scale(this.camera.zoom, this.camera.zoom);
        ctx.translate(-this.camera.x, -this.camera.y);

        // 1. Atmospheric Sky & Background Mountains
        this.renderSky(ctx);

        // 2. Destructible Bitmap Terrain
        ctx.drawImage(this.terrainCanvas, 0, 0);

        // 3. Render Supply Crates
        this.crates.forEach(cr => {
          ctx.save();
          ctx.translate(cr.x, cr.y);

          if (!cr.isLanded) {
            // White parachute canopy
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, -18, 16, Math.PI, 0);
            ctx.fill();
            // Cords
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-16, -18); ctx.lineTo(-6, -4);
            ctx.moveTo(16, -18); ctx.lineTo(6, -4);
            ctx.stroke();
          }

          // Crate box
          ctx.fillStyle = '#854d0e';
          ctx.fillRect(-8, -8, 16, 16);
          ctx.strokeStyle = '#ca8a04';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-8, -8, 16, 16);

          ctx.font = '9px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(cr.content === 'health' ? '💊' : (cr.content === 'holy' ? '✨' : '✈️'), 0, 0);
          ctx.restore();
        });

        // 4. Render Worms
        this.teams.forEach((team, tIdx) => {
          team.worms.forEach(worm => {
            this.renderWorm(ctx, worm, team);
          });
        });

        // 5. Render Bomber Jets
        this.jets.forEach(jet => {
          ctx.save();
          ctx.translate(jet.x, jet.y);
          ctx.scale(jet.vx > 0 ? 1 : -1, 1);

          ctx.fillStyle = '#1e293b';
          ctx.beginPath();
          ctx.moveTo(35, 0);
          ctx.lineTo(-25, -16);
          ctx.lineTo(-15, 0);
          ctx.lineTo(-25, 16);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // Afterburner
          ctx.fillStyle = '#f97316';
          ctx.beginPath();
          ctx.moveTo(-15, -4);
          ctx.lineTo(-28 - Math.random() * 8, 0);
          ctx.lineTo(-15, 4);
          ctx.fill();
          ctx.restore();
        });

        // 6. Render Target Beacon
        if (this.targetBeacon) {
          ctx.save();
          ctx.translate(this.targetBeacon.x, this.targetBeacon.y);
          ctx.strokeStyle = '#ff3344';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, 18, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-24, 0); ctx.lineTo(24, 0);
          ctx.moveTo(0, -24); ctx.lineTo(0, 24);
          ctx.stroke();
          ctx.restore();
        }

        // 7. Trajectory Arc Preview
        const activeWorm = this.getActiveWorm();
        if (activeWorm && this.state === 'turn_active' && !this.selectedWeaponId.includes('teleport') && !this.selectedWeaponId.includes('airstrike') && !this.selectedWeaponId.includes('girder')) {
          const aimRad = (this.aimAngle * Math.PI) / 180;
          const power = Math.max(30, this.aimPower || 45);
          const speed = power * 7.5;
          let simX = activeWorm.x + Math.cos(aimRad) * 18;
          let simY = activeWorm.y - Math.sin(aimRad) * 18;
          let simVx = Math.cos(aimRad) * speed;
          let simVy = -Math.sin(aimRad) * speed;
          const simDt = 0.04;

          ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
          for (let step = 0; step < 16; step++) {
            simVx += (this.selectedWeaponId === 'bazooka' ? this.wind * 25 : 0) * simDt;
            simVy += 380 * simDt;
            simX += simVx * simDt;
            simY += simVy * simDt;

            ctx.beginPath();
            ctx.arc(simX, simY, 2.2, 0, Math.PI * 2);
            ctx.fill();
            if (this.isSolidPixel(simX, simY) || simY >= this.waterLevel) break;
          }
        }

        // 8. Render Projectiles
        this.projectiles.forEach(p => {
          this.renderProjectile(ctx, p);
        });

        // 9. Render Particles
        this.particles.forEach(pt => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
          ctx.fillStyle = pt.color;
          ctx.fill();
        });

        // 6. Floating Damage / Speech Numbers
        this.floatingTexts.forEach(ft => {
          ctx.save();
          ctx.font = "bold 14px 'Fredoka One', 'Rubik', sans-serif";
          ctx.fillStyle = ft.color;
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 3;
          ctx.textAlign = 'center';
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        });

        // 7. Dynamic Water Layer (Rising animated waves)
        this.renderWater(ctx);

        ctx.restore();
      },

      renderSky(ctx) {
        // Deep Sky Gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, this.height);
        skyGrad.addColorStop(0, '#0284c7');
        skyGrad.addColorStop(0.5, '#7dd3fc');
        skyGrad.addColorStop(1, '#bae6fd');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(-200, -200, this.width + 400, this.height + 400);

        // Background clouds
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        for (let i = 0; i < 6; i++) {
          const cx = (i * 280 + this.waterTime * 5) % (this.width + 300) - 150;
          const cy = 120 + Math.sin(i * 1.5) * 35;
          ctx.beginPath();
          ctx.arc(cx, cy, 38, 0, Math.PI * 2);
          ctx.arc(cx + 30, cy - 8, 48, 0, Math.PI * 2);
          ctx.arc(cx + 65, cy, 32, 0, Math.PI * 2);
          ctx.fill();
        }
      },

      renderWorm(ctx, worm, team) {
        if (worm.hp <= 0) {
          // Render Tombstone
          ctx.save();
          ctx.translate(worm.x, worm.y);
          ctx.fillStyle = '#64748b';
          ctx.fillRect(-9, -16, 18, 16);
          ctx.beginPath();
          ctx.arc(0, -16, 9, Math.PI, 0);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = "bold 8px 'JetBrains Mono'";
          ctx.textAlign = 'center';
          ctx.fillText('R.I.P', 0, -8);
          ctx.restore();
          return;
        }

        ctx.save();
        ctx.translate(worm.x, worm.y);

        const isActive = (worm === this.getActiveWorm());

        // 1. Active Turn Indicator Arrow
        if (isActive) {
          const bounce = Math.sin(performance.now() * 0.008) * 5;
          ctx.fillStyle = team.color;
          ctx.beginPath();
          ctx.moveTo(0, -32 + bounce);
          ctx.lineTo(-6, -42 + bounce);
          ctx.lineTo(6, -42 + bounce);
          ctx.closePath();
          ctx.fill();
        }

        // 2. Health Bar & Name
        ctx.font = "bold 9px 'JetBrains Mono', sans-serif";
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2.5;
        ctx.strokeText(worm.name, 0, -22);
        ctx.fillText(worm.name, 0, -22);

        // Health Pill
        const bw = 24;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(-bw/2 - 1, -19, bw + 2, 4);
        ctx.fillStyle = team.color;
        ctx.fillRect(-bw/2, -18, bw * Math.max(0, worm.hp / worm.maxHp), 2.5);

        // 3. Cute Worm Body (Tubular segmented cartoon worm)
        ctx.scale(worm.facing, 1);

        // Tail / Lower body
        ctx.fillStyle = '#f472b6'; // Warm worm pink
        ctx.beginPath();
        ctx.arc(-5, 4, 6, 0, Math.PI * 2);
        ctx.fill();

        // Main belly segment
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.fill();

        // Head segment
        ctx.beginPath();
        ctx.arc(4, -6, 7.5, 0, Math.PI * 2);
        ctx.fill();

        // Team Colored Bandana
        ctx.fillStyle = team.color;
        ctx.fillRect(0, -11, 8, 3.5);
        ctx.beginPath();
        ctx.moveTo(0, -9);
        ctx.lineTo(-5, -6);
        ctx.lineTo(-4, -10);
        ctx.fill();

        // Big Googly Eyes
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(6, -7, 3.2, 0, Math.PI * 2);
        ctx.arc(10, -7, 2.8, 0, Math.PI * 2);
        ctx.fill();

        // Eye Pupils (looking forward/up)
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(7.2, -7, 1.4, 0, Math.PI * 2);
        ctx.arc(11, -7, 1.2, 0, Math.PI * 2);
        ctx.fill();

        // 4. Weapon in Hand / Aiming Direction
        if (isActive && this.state === 'turn_active') {
          const aimRad = (this.aimAngle * Math.PI) / 180;
          ctx.save();
          ctx.translate(4, -4);
          ctx.rotate(-aimRad * worm.facing);

          // Draw weapon silhouette
          if (this.selectedWeaponId === 'bazooka') {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, -3, 16, 6);
            ctx.fillStyle = '#22c55e'; // Green military band
            ctx.fillRect(4, -3.5, 3, 7);
          } else if (this.selectedWeaponId === 'grenade' || this.selectedWeaponId === 'cluster') {
            ctx.fillStyle = '#15803d';
            ctx.beginPath();
            ctx.arc(10, 0, 4.5, 0, Math.PI * 2);
            ctx.fill();
          } else if (this.selectedWeaponId === 'shotgun') {
            ctx.fillStyle = '#78350f';
            ctx.fillRect(0, -2, 14, 4);
          } else if (this.selectedWeaponId === 'holy') {
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(10, 0, 5, 0, Math.PI * 2);
            ctx.fill();
          } else if (this.selectedWeaponId === 'bat') {
            ctx.fillStyle = '#b45309';
            ctx.fillRect(0, -2.5, 18, 5);
          }

          // Dotted Aim Trajectory Arc
          ctx.setLineDash([3, 4]);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(16, 0);
          ctx.lineTo(65, 0);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.restore();
        }

        ctx.restore();
      },

      renderProjectile(ctx, p) {
        ctx.save();
        ctx.translate(p.x, p.y);

        if (p.type === 'bazooka') {
          const angle = Math.atan2(p.vy, p.vx);
          ctx.rotate(angle);
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(-6, -2.5, 10, 5);
          ctx.fillStyle = '#ef4444'; // Red warhead
          ctx.beginPath();
          ctx.moveTo(4, -2.5);
          ctx.lineTo(9, 0);
          ctx.lineTo(4, 2.5);
          ctx.fill();
        } else if (p.type === 'grenade') {
          ctx.fillStyle = '#166534';
          ctx.beginPath();
          ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
          ctx.fill();
          // Timer badge overhead
          ctx.fillStyle = '#ffffff';
          ctx.font = "bold 9px 'JetBrains Mono'";
          ctx.fillText(Math.ceil(p.timer), 0, -8);
        } else if (p.type === 'holy') {
          ctx.fillStyle = '#facc15';
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = "bold 9px 'JetBrains Mono'";
          ctx.fillText(Math.ceil(p.timer), 0, -8);
        } else if (p.type === 'dynamite') {
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(-3, -7, 6, 14);
          ctx.fillStyle = '#ffffff';
          ctx.font = "bold 9px 'JetBrains Mono'";
          ctx.fillText(Math.ceil(p.timer), 0, -10);
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      },

      renderWater(ctx) {
        ctx.save();
        const wl = this.waterLevel;
        const w = this.width;

        // Animated ocean sine wave
        ctx.beginPath();
        ctx.moveTo(-100, this.height);
        for (let x = -100; x <= w + 100; x += 15) {
          const y = wl + Math.sin(x * 0.02 + this.waterTime) * 6;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(w + 100, this.height);
        ctx.closePath();

        const wGrad = ctx.createLinearGradient(0, wl, 0, this.height);
        wGrad.addColorStop(0, 'rgba(2, 132, 199, 0.82)');
        wGrad.addColorStop(1, 'rgba(3, 105, 161, 0.96)');
        ctx.fillStyle = wGrad;
        ctx.fill();

        // White wave crest line
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();
      },

      /* =======================================================================
         INPUTS (KEYBOARD & TOUCH CONTROLS)
         ======================================================================= */
      setupKeyboard() {
        window.addEventListener('keydown', (e) => {
          AudioEngine.resume();
          if (e.code === 'KeyA' || e.code === 'ArrowLeft') this.touch.walkLeft = true;
          if (e.code === 'KeyD' || e.code === 'ArrowRight') this.touch.walkRight = true;
          if (e.code === 'KeyW' || e.code === 'ArrowUp') this.adjustAimAngle(3);
          if (e.code === 'KeyS' || e.code === 'ArrowDown') this.adjustAimAngle(-3);
          if (e.code === 'Enter') this.jumpHop();
          if (e.code === 'Backspace') this.jumpFlip();
          if (e.code === 'Space') this.fireCurrentWeapon();
          if (e.code === 'KeyT') this.openWeaponModal();
        });

        window.addEventListener('keyup', (e) => {
          if (e.code === 'KeyA' || e.code === 'ArrowLeft') this.touch.walkLeft = false;
          if (e.code === 'KeyD' || e.code === 'ArrowRight') this.touch.walkRight = false;
          if (e.code === 'Space') this.releaseFire();
        });
      },

      setupTouchControls() {
        // Walk Left / Right
        const bindHold = (elId, onStart, onEnd) => {
          const el = document.getElementById(elId);
          if (!el) return;
          el.addEventListener('pointerdown', (e) => { e.preventDefault(); AudioEngine.resume(); el.classList.add('active'); onStart(); });
          el.addEventListener('pointerup', (e) => { e.preventDefault(); el.classList.remove('active'); onEnd(); });
          el.addEventListener('pointercancel', (e) => { e.preventDefault(); el.classList.remove('active'); onEnd(); });
        };

        bindHold('btn-walk-left', () => this.touch.walkLeft = true, () => this.touch.walkLeft = false);
        bindHold('btn-walk-right', () => this.touch.walkRight = true, () => this.touch.walkRight = false);

        // Jumps
        const bindTap = (elId, callback) => {
          const el = document.getElementById(elId);
          if (!el) return;
          el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            AudioEngine.resume();
            callback();
          });
        };

        bindTap('btn-jump-hop', () => this.jumpHop());
        bindTap('btn-jump-flip', () => this.jumpFlip());

        // Aim Up / Down
        bindHold('btn-aim-up', () => this.startAimRepeat(3), () => this.stopAimRepeat());
        bindHold('btn-aim-down', () => this.startAimRepeat(-3), () => this.stopAimRepeat());

        // Fire Button Press & Hold Power Charge
        const fireBtn = document.getElementById('btn-fire');
        if (fireBtn) {
          fireBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            AudioEngine.resume();
            fireBtn.classList.add('charging');
            this.fireCurrentWeapon();
          });
          fireBtn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            fireBtn.classList.remove('charging');
            this.releaseFire();
          });
          fireBtn.addEventListener('pointercancel', (e) => {
            e.preventDefault();
            fireBtn.classList.remove('charging');
            this.releaseFire();
          });
        }

        // Direct Canvas Touch Interaction (Aiming, Airstrike/Teleport Beacon Tap)
        this.canvas.addEventListener('pointerdown', (e) => {
          if (this.state !== 'turn_active') return;
          const pos = this.screenToWorld(e.clientX, e.clientY);
          const worm = this.getActiveWorm();

          if (this.selectedWeaponId === 'airstrike' || this.selectedWeaponId === 'teleport' || this.selectedWeaponId === 'girder') {
            this.targetBeacon = { x: pos.x, y: pos.y, type: this.selectedWeaponId };
            this.executeShot(100);
            return;
          }

          if (worm) {
            this.touch.isAimingTouch = true;
            this.updateAimFromTouch(pos.x, pos.y, worm);
          }
        });

        this.canvas.addEventListener('pointermove', (e) => {
          if (!this.touch.isAimingTouch || this.state !== 'turn_active') return;
          const pos = this.screenToWorld(e.clientX, e.clientY);
          const worm = this.getActiveWorm();
          if (worm) {
            this.updateAimFromTouch(pos.x, pos.y, worm);
          }
        });

        this.canvas.addEventListener('pointerup', () => {
          this.touch.isAimingTouch = false;
        });

        this.canvas.addEventListener('pointercancel', () => {
          this.touch.isAimingTouch = false;
        });
      },

      screenToWorld(clientX, clientY) {
        const rect = this.canvas.getBoundingClientRect();
        const screenX = clientX - rect.left;
        const screenY = clientY - rect.top;
        const worldX = (screenX - this.canvas.width / 2) / this.camera.zoom + this.camera.x;
        const worldY = (screenY - this.canvas.height / 2) / this.camera.zoom + this.camera.y;
        return { x: worldX, y: worldY };
      },

      updateAimFromTouch(tx, ty, worm) {
        const dx = tx - worm.x;
        const dy = ty - worm.y;
        let deg = Math.atan2(-dy, dx) * 180 / Math.PI;
        if (deg < 0) deg += 360;
        this.aimAngle = Math.max(5, Math.min(175, deg));
        worm.facing = (dx >= 0) ? 1 : -1;
        this.updateHUD();
      },

      jumpHop() {
        if (this.state !== 'turn_active' && this.state !== 'retreat') return;
        const worm = this.getActiveWorm();
        if (!worm) return;
        worm.vy = -280;
        worm.vx = worm.facing * 120;
        AudioEngine.playWormVoice('jump');
      },

      jumpFlip() {
        if (this.state !== 'turn_active' && this.state !== 'retreat') return;
        const worm = this.getActiveWorm();
        if (!worm) return;
        worm.vy = -420;
        worm.vx = -worm.facing * 80;
        AudioEngine.playWormVoice('jump');
      },

      adjustAimAngle(delta) {
        this.aimAngle = Math.max(5, Math.min(175, this.aimAngle + delta));
        this.updateHUD();
      },

      startAimRepeat(delta) {
        this.adjustAimAngle(delta);
        this.aimInterval = setInterval(() => this.adjustAimAngle(delta), 60);
      },

      stopAimRepeat() {
        clearInterval(this.aimInterval);
      },

      populateWeaponGrid() {
        const container = document.getElementById('weapon-grid-container');
        if (!container) return;
        container.innerHTML = '';

        WEAPONS.forEach(w => {
          const card = document.createElement('div');
          card.className = `weapon-card ${w.id === this.selectedWeaponId ? 'selected' : ''}`;
          card.onclick = () => this.selectWeapon(w.id);
          card.innerHTML = `
            <div class="weapon-card-icon">${w.icon}</div>
            <div class="weapon-card-name">${w.name}</div>
            <div class="weapon-card-ammo">${w.ammo === Infinity ? '∞' : w.ammo}</div>
          `;
          container.appendChild(card);
        });
      },

      selectWeapon(id) {
        this.selectedWeaponId = id;
        this.populateWeaponGrid();
        this.updateHUD();
        this.closeWeaponModal();
      },

      setGrenadeTimer(sec) {
        this.grenadeTimer = sec;
        document.querySelectorAll('.timer-chip').forEach((btn, idx) => {
          btn.classList.toggle('active', idx + 1 === sec);
        });
      },

      openWeaponModal() {
        const modal = document.getElementById('weapon-modal');
        if (modal) modal.style.display = 'flex';
      },

      closeWeaponModal() {
        const modal = document.getElementById('weapon-modal');
        if (modal) modal.style.display = 'none';
      },

      openMenuModal() {
        const modal = document.getElementById('menu-modal');
        if (modal) modal.style.display = 'flex';
      },

      recenterCamera() {
        const worm = this.getActiveWorm();
        if (worm) {
          this.camera.targetX = worm.x;
          this.camera.targetY = worm.y - 40;
        }
      },

      toggleZoom() {
        this.camera.targetZoom = (this.camera.targetZoom === 1.0) ? 0.65 : 1.0;
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      Game.init();
    });
  </script>
</body>
</html>
