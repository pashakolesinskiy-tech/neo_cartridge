<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WORMS 2008: POCKET WARS // NEO-CARTRIDGE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=JetBrains+Mono:wght@600;800;900&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-title: 'Fredoka One', 'Rubik', cursive, sans-serif;
      --font-body: 'Rubik', sans-serif;
      --font-code: 'JetBrains Mono', monospace;

      --team-red: #ff3344;
      --team-blue: #00d2ff;
      --team-green: #22c55e;
      --team-yellow: #facc15;

      --bg-hud: rgba(15, 23, 42, 0.88);
      --border-hud: rgba(255, 255, 255, 0.18);
      --water-color: #0284c7;
      --water-deep: #0369a1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      font-family: var(--font-body);
      color: #ffffff;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* =========================================================================
       HUD OVERLAY (TOP BAR)
       ========================================================================= */
    .hud-top-bar {
      position: absolute;
      top: max(8px, env(safe-area-inset-top, 8px));
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 50;
    }

    .hud-panel {
      background: var(--bg-hud);
      border: 1px solid var(--border-hud);
      border-radius: 14px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      pointer-events: auto;
    }

    .team-badge {
      font-family: var(--font-title);
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .team-badge.team-red { color: var(--team-red); text-shadow: 0 0 10px rgba(255, 51, 68, 0.4); }
    .team-badge.team-blue { color: var(--team-blue); text-shadow: 0 0 10px rgba(0, 210, 255, 0.4); }

    .timer-badge {
      font-family: var(--font-code);
      font-size: 1.15rem;
      font-weight: 900;
      background: rgba(0, 0, 0, 0.5);
      padding: 3px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      min-width: 52px;
      text-align: center;
    }

    .timer-badge.danger {
      color: #ff3344;
      animation: timerPulse 0.6s infinite alternate;
      border-color: #ff3344;
    }

    @keyframes timerPulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); text-shadow: 0 0 12px #ff3344; }
    }

    /* Wind Meter */
    .wind-meter-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-code);
      font-size: 0.85rem;
      font-weight: 800;
    }

    .wind-track {
      width: 90px;
      height: 10px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
    }

    .wind-center-pin {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: rgba(255, 255, 255, 0.5);
      transform: translateX(-50%);
    }

    .wind-fill {
      position: absolute;
      top: 0;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #0284c7);
      transition: all 0.25s ease;
    }

    /* Action Buttons in Header */
    .hud-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .hud-btn:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.2);
    }

    /* =========================================================================
       ACTIVE WEAPON & RETREAT BAR
       ========================================================================= */
    .retreat-alert {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.92);
      border: 2px solid #ffffff;
      border-radius: 14px;
      padding: 6px 20px;
      font-family: var(--font-title);
      font-size: 1.1rem;
      color: #fff;
      display: none;
      animation: alertBounce 0.5s ease infinite alternate;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.6);
      z-index: 45;
      pointer-events: none;
    }

    @keyframes alertBounce {
      from { transform: translateX(-50%) translateY(0); }
      to { transform: translateX(-50%) translateY(-4px); }
    }

    /* =========================================================================
       TOUCH CONTROLS (MOBILE OPTIMIZED)
       ========================================================================= */
    .touch-controls {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
    }

    /* Left Zone: Walking & Jumps */
    .touch-dpad-box {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom, 18px));
      left: max(16px, env(safe-area-inset-left, 16px));
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
    }

    .touch-jump-row {
      display: flex;
      gap: 12px;
    }

    .touch-walk-row {
      display: flex;
      gap: 14px;
    }

    .ctrl-btn {
      border: none;
      border-radius: 16px;
      background: rgba(30, 41, 59, 0.88);
      color: #ffffff;
      font-family: var(--font-title);
      font-size: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      touch-action: none;
      transition: transform 0.08s ease, background 0.08s ease;
    }

    .ctrl-btn:active, .ctrl-btn.active {
      transform: scale(0.92);
      background: rgba(56, 189, 248, 0.4);
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
    }

    .btn-walk {
      width: 68px;
      height: 56px;
      font-size: 1.4rem;
    }

    .btn-jump {
      width: 68px;
      height: 48px;
      font-size: 0.95rem;
      background: rgba(15, 23, 42, 0.92);
    }

    .btn-jump small {
      font-size: 0.625rem;
      font-family: var(--font-code);
      opacity: 0.8;
      margin-top: -2px;
    }

    /* Right Zone: Aiming & Weapon / Fire Trigger */
    .touch-aim-box {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom, 18px));
      right: max(16px, env(safe-area-inset-right, 16px));
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      pointer-events: auto;
    }

    .aim-adjust-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--border-hud);
      padding: 4px 10px;
      border-radius: 14px;
    }

    .btn-aim {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      font-size: 1.1rem;
    }

    .aim-angle-label {
      font-family: var(--font-code);
      font-size: 0.95rem;
      font-weight: 900;
      min-width: 46px;
      text-align: center;
      color: #38bdf8;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-arsenal {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border: 2px solid #93c5fd;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.5);
    }

    .btn-arsenal-icon {
      font-size: 1.8rem;
    }

    .btn-arsenal small {
      font-size: 0.625rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    /* BIG FIRE BUTTON with Pulsing Power Gauge */
    .btn-fire-wrap {
      position: relative;
      width: 86px;
      height: 86px;
    }

    .btn-fire {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #ff3344 0%, #b91c1c 100%);
      border: 3px solid #fecaca;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
      font-family: var(--font-title);
      font-size: 1.35rem;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      transition: transform 0.1s ease;
    }

    .btn-fire:active, .btn-fire.charging {
      transform: scale(0.95);
      box-shadow: 0 0 25px #ff3344;
    }

    .power-ring-svg {
      position: absolute;
      top: -6px;
      left: -6px;
      width: 98px;
      height: 98px;
      transform: rotate(-90deg);
      pointer-events: none;
    }

    .power-ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 6;
    }

    .power-ring-fill {
      fill: none;
      stroke: #facc15;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 276;
      stroke-dashoffset: 276;
      transition: stroke-dashoffset 0.05s linear;
    }

    /* Floating Weapon Badge on Screen Bottom-Center */
    .current-weapon-pill {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom, 18px));
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-hud);
      border: 2px solid #38bdf8;
      border-radius: 20px;
      padding: 6px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      pointer-events: auto;
      z-index: 45;
    }

    .weapon-pill-icon {
      font-size: 1.5rem;
    }

    .weapon-pill-name {
      font-family: var(--font-title);
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }

    .weapon-pill-ammo {
      font-family: var(--font-code);
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 8px;
      border-radius: 6px;
      color: #facc15;
      border: 1px solid rgba(250, 204, 21, 0.3);
    }

    /* =========================================================================
       WEAPON ARSENAL MODAL
       ========================================================================= */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 7, 14, 0.78);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }

    .weapon-modal-card {
      width: 100%;
      max-width: 480px;
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(56, 189, 248, 0.3);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 8px;
    }

    .modal-title {
      font-family: var(--font-title);
      font-size: 1.3rem;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    .modal-close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }

    .weapon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .weapon-card {
      background: rgba(30, 41, 59, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      position: relative;
      transition: all 0.12s ease;
    }

    .weapon-card:active, .weapon-card.selected {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      transform: scale(0.96);
    }

    .weapon-card-icon {
      font-size: 1.8rem;
    }

    .weapon-card-name {
      font-family: var(--font-body);
      font-size: 0.725rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.1;
    }

    .weapon-card-ammo {
      font-family: var(--font-code);
      font-size: 0.65rem;
      color: #facc15;
      font-weight: 800;
    }

    /* Grenade Timer Selector Row */
    .timer-selector-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    .timer-btn-group {
      display: flex;
      gap: 6px;
    }

    .timer-chip {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-family: var(--font-code);
      font-weight: 900;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .timer-chip.active {
      background: #facc15;
      color: #000;
      border-color: #facc15;
    }

    /* =========================================================================
       MAIN MENU & VICTORY OVERLAY
       ========================================================================= */
    .menu-card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #38bdf8;
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 45px rgba(0, 0, 0, 0.85), 0 0 35px rgba(56, 189, 248, 0.35);
    }

    .menu-logo-title {
      font-family: var(--font-title);
      font-size: 2.1rem;
      line-height: 1.1;
      background: linear-gradient(180deg, #ffedd5 0%, #f97316 45%, #ef4444 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 10px rgba(249, 115, 22, 0.5));
      letter-spacing: 0.5px;
    }

    .menu-subtitle {
      font-family: var(--font-code);
      font-size: 0.825rem;
      letter-spacing: 1px;
      color: #94a3b8;
    }

    .menu-btn {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 14px;
      color: #ffffff;
      font-family: var(--font-title);
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.15s ease;
    }

    .menu-btn.primary {
      background: linear-gradient(135deg, #f97316, #dc2626);
      border-color: #fed7aa;
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.45);
    }

    .menu-btn:active {
      transform: scale(0.96);
    }

    .turn-announcer {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(15, 23, 42, 0.94);
      border: 3px solid #fff;
      border-radius: 20px;
      padding: 14px 28px;
      font-family: var(--font-title);
      font-size: 1.6rem;
      color: #fff;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
    }

    .turn-announcer.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- Top HUD Bar -->
    <div class="hud-top-bar">
      <!-- Left: Active Team & Turn Timer -->
      <div class="hud-panel">
        <div id="hud-team-badge" class="team-badge team-red">
          <span>🐛</span>
          <span id="hud-team-name">КРАСНЫЕ</span>
        </div>
        <div id="hud-turn-timer" class="timer-badge">45</div>
      </div>

      <!-- Center: Wind Gauge -->
      <div class="hud-panel">
        <div class="wind-meter-wrap">
          <span style="font-size:1.1rem;">💨</span>
          <div class="wind-track">
            <div class="wind-center-pin"></div>
            <div id="wind-fill-bar" class="wind-fill" style="left:50%; width:0%;"></div>
          </div>
          <span id="wind-val-text">0.0</span>
        </div>
      </div>

      <!-- Right: Utility Controls (Center Camera, Zoom, Menu) -->
      <div class="hud-panel" style="gap:6px;">
        <button class="hud-btn" onclick="Game.recenterCamera()" title="Навести на червяка">🎯</button>
        <button class="hud-btn" onclick="Game.toggleZoom()" title="Масштаб карты">🔍</button>
        <button class="hud-btn" onclick="Game.openMenuModal()" title="Меню">⚙️</button>
      </div>
    </div>

    <!-- Active Retreat Countdown Banner -->
    <div id="retreat-alert" class="retreat-alert">
      ⏳ УКРЫВАЙТЕСЬ! <span id="retreat-timer-val">5</span>с
    </div>

    <!-- Center Bottom: Quick Weapon Pill -->
    <div class="current-weapon-pill" onclick="Game.openWeaponModal()">
      <span id="pill-weapon-icon" class="weapon-pill-icon">🚀</span>
      <span id="pill-weapon-name" class="weapon-pill-name">БАЗУКА</span>
      <span id="pill-weapon-ammo" class="weapon-pill-ammo">∞</span>
    </div>

    <!-- Turn Transition Flash Announcement -->
    <div id="turn-announcer" class="turn-announcer">
      ХОД: КОМАНДА КРАСНЫХ
    </div>

    <!-- Touch Controls Layer (Phone Optimized) -->
    <div class="touch-controls">
      <!-- Left: D-Pad & Jumps -->
      <div class="touch-dpad-box">
        <div class="touch-jump-row">
          <button id="btn-jump-hop" class="ctrl-btn btn-jump">
            <span>▲</span>
            <small>ПРЫЖОК</small>
          </button>
          <button id="btn-jump-flip" class="ctrl-btn btn-jump">
            <span>↺</span>
            <small>САЛЬТО</small>
          </button>
        </div>
        <div class="touch-walk-row">
          <button id="btn-walk-left" class="ctrl-btn btn-walk">◀</button>
          <button id="btn-walk-right" class="ctrl-btn btn-walk">▶</button>
        </div>
      </div>

      <!-- Right: Aim Angles & Big Fire Button -->
      <div class="touch-aim-box">
        <div class="aim-adjust-row">
          <button id="btn-aim-down" class="ctrl-btn btn-aim">▼</button>
          <span id="aim-angle-text" class="aim-angle-label">45°</span>
          <button id="btn-aim-up" class="ctrl-btn btn-aim">▲</button>
        </div>

        <div class="action-row">
          <button class="ctrl-btn btn-arsenal" onclick="Game.openWeaponModal()" title="Выбрать оружие">
            <span class="btn-arsenal-icon">🎒</span>
            <small>ОРУЖИЕ</small>
          </button>

          <div class="btn-fire-wrap">
            <svg class="power-ring-svg">
              <circle class="power-ring-bg" cx="49" cy="49" r="44"></circle>
              <circle id="power-ring-fill" class="power-ring-fill" cx="49" cy="49" r="44"></circle>
            </svg>
            <button id="btn-fire" class="btn-fire">
              <span>ОГОНЬ</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Weapon Arsenal Modal -->
    <div id="weapon-modal" class="modal-overlay">
      <div class="weapon-modal-card">
        <div class="modal-header">
          <span class="modal-title">АРСЕНАЛ ОРУЖИЯ</span>
          <button class="modal-close-btn" onclick="Game.closeWeaponModal()">✕</button>
        </div>

        <div class="weapon-grid" id="weapon-grid-container">
          <!-- Dynamically populated weapon cards -->
        </div>

        <!-- Grenade Fuse Timer selector -->
        <div id="grenade-timer-box" class="timer-selector-row">
          <span style="font-weight:700;">⏱️ Таймер гранаты:</span>
          <div class="timer-btn-group">
            <button class="timer-chip" onclick="Game.setGrenadeTimer(1)">1с</button>
            <button class="timer-chip" onclick="Game.setGrenadeTimer(2)">2с</button>
            <button class="timer-chip active" onclick="Game.setGrenadeTimer(3)">3с</button>
            <button class="timer-chip" onclick="Game.setGrenadeTimer(4)">4с</button>
            <button class="timer-chip" onclick="Game.setGrenadeTimer(5)">5с</button>
          </div>

  <script>
    /**
     * PROCEDURAL SYNTHESIZED WEB AUDIO (Worms Cute Voice Lines & Weapon SFX)
     */
    const AudioEngine = {
      ctx: null,
      muted: false,

      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
      },

      resume() {
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },

      // Cute squeaky Worm voice generator
      playWormVoice(type) {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'fire') {
          // High-pitch chirp "Fire!"
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(1400, now + 0.1);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.22);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.23);
        } else if (type === 'jump') {
          // Cute hop squeak
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(1100, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.13);
        } else if (type === 'ouch') {
          // Pain pitch bend
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(950, now);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.25);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.26);
        } else if (type === 'drown') {
          // Bye-bye descending squeak
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.setValueAtTime(900, now + 0.12);
          osc.frequency.exponentialRampToValueAtTime(250, now + 0.4);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.42);
        } else if (type === 'yippee') {
          // Victory chirp
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(650, now);
          osc.frequency.setValueAtTime(1050, now + 0.1);
          osc.frequency.setValueAtTime(1500, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.36);
        }
      },

      playBazookaLaunch() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      },

      playBounce() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.08);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      },

      playExplosion() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.45;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, now);
        filter.frequency.exponentialRampToValueAtTime(40, now + 0.45);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      },

      playSplash() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.35;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(400, now);
        filter.frequency.exponentialRampToValueAtTime(1400, now + 0.15);
        filter.frequency.exponentialRampToValueAtTime(300, now + 0.35);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      },

      playHolyHallelujah() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C Major Chord
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.04);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.04);
          osc.stop(now + 0.75);
        });
      },

      playShotgun() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.18);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.19);
      },

      playBatHit() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(900, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      },

      playJetSound() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 1.5;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(300, now);
        filter.frequency.exponentialRampToValueAtTime(1800, now + 0.7);
        filter.frequency.exponentialRampToValueAtTime(200, now + 1.5);
        filter.Q.value = 2.0;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.35, now + 0.7);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      },

      playTeleportSound() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        for (let i = 0; i < 4; i++) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400 + i * 250, now + i * 0.05);
          osc.frequency.exponentialRampToValueAtTime(1600 + i * 300, now + 0.35);
          gain.gain.setValueAtTime(0.12, now + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.05);
          osc.stop(now + 0.36);
        }
      },

      playCratePickup() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.06);
          gain.gain.setValueAtTime(0.18, now + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + (idx + 1) * 0.08 + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + (idx + 1) * 0.08 + 0.12);
        });
      }
    };

    /**

    /**

    const Game = {
      canvas: null,
      ctx: null,
      width: 1400,
      height: 750,

      // Destructible Terrain Surfaces
      terrainCanvas: null,
      terrainCtx: null,

      mode: 'solo_ai', // 'solo_ai', 'hotseat', 'practice'
      state: 'menu', // 'menu', 'turn_active', 'retreat', 'resolving', 'game_over'

      teams: [],
      activeTeamIdx: 0,
      turnTimer: 45,
      retreatTimer: 5,
      wind: 0, // -5 to +5
      waterLevel: 685,
      waterTime: 0,

      // Camera
      camera: { x: 700, y: 375, targetX: 700, targetY: 375, zoom: 1.0, targetZoom: 1.0 },

      // Aim & Power
      aimAngle: 45, // In degrees (0 = right, 90 = up, 180 = left)
      aimPower: 0,  // 0 to 100
      isChargingFire: false,
      chargeDirection: 1,
      selectedWeaponId: 'bazooka',
      grenadeTimer: 3,
      shotgunShotsLeft: 0,

      // Entities & Physics
      projectiles: [],
      crates: [],
      jets: [],
      targetBeacon: null,
      particles: [],
      floatingTexts: [],
      debris: [],

      // Touch Controls State
      touch: {
        walkLeft: false,
        walkRight: false,
        isAimingTouch: false,
        dragStartX: 0,
        dragStartY: 0
      },

      init() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');

        // Create offscreen terrain buffer
        this.terrainCanvas = document.createElement('canvas');
        this.terrainCanvas.width = this.width;
        this.terrainCanvas.height = this.height;
        this.terrainCtx = this.terrainCanvas.getContext('2d', { willReadFrequently: true });

        this.resize();
        window.addEventListener('resize', () => this.resize());
        window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 150));

        this.setupKeyboard();
        this.setupTouchControls();
        this.populateWeaponGrid();

        // Start render loop
        requestAnimationFrame((t) => this.loop(t));
      },

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      },

      /* =======================================================================
         TERRAIN GENERATION & PIXEL DESTRUCTION
         ======================================================================= */
      generateTerrain() {
        const tctx = this.terrainCtx;
        const w = this.width;
        const h = this.height;

        tctx.clearRect(0, 0, w, h);

        // Procedural multi-frequency sine terrain with natural hills and caverns
        tctx.beginPath();
        tctx.moveTo(0, h);

        const groundBase = 460;
        for (let x = 0; x <= w; x += 6) {
          const y = groundBase 
            + Math.sin(x * 0.004) * 110 
            + Math.sin(x * 0.012) * 55 
            + Math.cos(x * 0.025) * 22;
          if (x === 0) tctx.lineTo(x, y);
          else tctx.lineTo(x, y);
        }
        tctx.lineTo(w, h);
        tctx.closePath();

        // 1. Earth Dirt Gradient Fill
        const dirtGrad = tctx.createLinearGradient(0, 200, 0, h);
        dirtGrad.addColorStop(0, '#854d0e'); // Golden brown
        dirtGrad.addColorStop(0.4, '#713f12'); // Rich dirt
        dirtGrad.addColorStop(1, '#3b1d07'); // Deep subterranean rock
        tctx.fillStyle = dirtGrad;
        tctx.fill();

        // 2. Add floating cavern islands
        for (let i = 0; i < 3; i++) {
          const ix = 250 + i * 380 + (Math.random() - 0.5) * 60;
          const iy = 260 + (Math.random() - 0.5) * 50;
          tctx.beginPath();
          tctx.ellipse(ix, iy, 75 + Math.random() * 25, 24 + Math.random() * 8, 0, 0, Math.PI * 2);
          tctx.fill();
        }

        // 3. Top Lush Green Grass Layer
        tctx.save();
        tctx.globalCompositeOperation = 'source-atop';
        tctx.strokeStyle = '#22c55e';
        tctx.lineWidth = 10;
        tctx.beginPath();
        for (let x = 0; x <= w; x += 6) {
          const y = groundBase 
            + Math.sin(x * 0.004) * 110 
            + Math.sin(x * 0.012) * 55 
            + Math.cos(x * 0.025) * 22;
          if (x === 0) tctx.moveTo(x, y);
          else tctx.lineTo(x, y);
        }
        tctx.stroke();

        // High grass highlights
        tctx.strokeStyle = '#4ade80';
        tctx.lineWidth = 3.5;
        tctx.stroke();
        tctx.restore();
      },

      carveCrater(cx, cy, radius) {
        const tctx = this.terrainCtx;
        tctx.save();
        tctx.globalCompositeOperation = 'destination-out';

        // Main blast circular crater
        tctx.beginPath();
        tctx.arc(cx, cy, radius, 0, Math.PI * 2);
        tctx.fill();

        // 6 Jagged irregular sub-craters to feel like authentic Worms craters
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI * 2 / 6) * i + Math.random() * 0.4;
          const d = radius * (0.65 + Math.random() * 0.35);
          const subR = radius * (0.35 + Math.random() * 0.25);
          tctx.beginPath();
          tctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, subR, 0, Math.PI * 2);
          tctx.fill();
        }
        tctx.restore();

        // Spawn flying soil and spark particles
        for (let k = 0; k < 18; k++) {
          const pa = Math.random() * Math.PI * 2;
          const spd = 60 + Math.random() * 200;
          this.particles.push({
            type: 'dirt',
            x: cx + Math.cos(pa) * (radius * 0.5),
            y: cy + Math.sin(pa) * (radius * 0.5),
            vx: Math.cos(pa) * spd,
            vy: Math.sin(pa) * spd - 60,
            radius: 2 + Math.random() * 3.5,
            color: Math.random() > 0.4 ? '#854d0e' : '#22c55e',
            life: 0.8 + Math.random() * 0.5
          });
        }
      },

      isSolidPixel(x, y) {
        if (x < 0 || x >= this.width || y < 0) return false;
        if (y >= this.height) return true; // Bottom floor
        try {
          const pixel = this.terrainCtx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
          return pixel[3] > 60; // Alpha check
        } catch (e) {
          return false;
        }
      },

      /* =======================================================================
         BATTLE INITIALIZATION & TEAMS
         ======================================================================= */
      startBattle(mode) {
        AudioEngine.init();

        this.mode = mode;

        this.generateTerrain();

        // Setup Teams

              { name: 'Гренадер', hp: 100, maxHp: 100, x: 1120, y: 150, vx: 0, vy: 0, facing: -1, state: 'idle' }
            ]
          }
        ];

        // Drop worms safely onto the generated terrain
        this.teams.forEach(team => {
